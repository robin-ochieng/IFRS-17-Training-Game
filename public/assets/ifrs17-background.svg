<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0137A6"/>
      <stop offset="55%" stop-color="#0b285c"/>
      <stop offset="100%" stop-color="#041229"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f6efe3" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#d3f1ea" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="waveBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ca3ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0137A6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="waveGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd9b9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2c6f68" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="waveGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3c977" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9b7cfe" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix type="saturate" values="0.2"/>
      <feBlend in="SourceGraphic" in2="noise" mode="soft-light" result="grainBlend"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="720" cy="360" r="620" fill="url(#glow)" opacity="0.85"/>
  <g filter="url(#softBlur)">
    <path d="M-120 640 C220 520 420 780 720 640 C980 520 1180 720 1580 520 L1580 1040 L-120 1040 Z" fill="url(#waveBlue)" opacity="0.55"/>
    <path d="M-160 520 C180 420 400 620 690 500 C980 380 1210 520 1560 360 L1560 1040 L-160 1040 Z" fill="url(#waveGreen)" opacity="0.45"/>
    <path d="M-200 760 C120 660 480 940 760 820 C1040 700 1280 820 1660 620 L1660 1040 L-200 1040 Z" fill="url(#waveGold)" opacity="0.35"/>
  </g>
  <g filter="url(#grain)" opacity="0.25">
    <rect width="1440" height="900" fill="#ffffff" fill-opacity="0.02"/>
  </g>
</svg>
